[project]
name = "finalproject_kistanov_26_555"
version = "0.1.0"
description = "Консольное приложение для работы с валютным кошельком"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "prettytable>=3.18.0",
    "requests>=2.34.2",
]

[project.scripts]
finalproject_kistanov_26_555 = "valutatrade_hub.cli.interface:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "valutatrade_hub"
module-root = ""
source-include = ["main.py", "data/README.md", "uv.lock"]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = [".uv-cache", ".venv-install"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[dependency-groups]
dev = [
    "ruff>=0.17.2",
]

[tool.valutatrade]
data_dir = "data"
users_file = "users.json"
portfolios_file = "portfolios.json"
rates_file = "rates.json"
history_file = "exchange_rates.json"
rates_ttl_seconds = 300
default_base_currency = "USD"
log_dir = "logs"
log_file = "actions.log"
parser_log_file = "parser.log"
log_format = "json"
log_level = "INFO"
log_max_bytes = 1048576
log_backup_count = 3
log_verbose = false
parser_base_currency = "USD"
parser_fiat_currencies = ["EUR", "GBP", "RUB"]
parser_crypto_currencies = ["BTC", "ETH", "SOL"]
request_timeout = 10
update_interval_seconds = 300
